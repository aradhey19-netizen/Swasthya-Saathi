<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SwasthyaSaathi: plain-language health information, symptom guidance, hospitals and government schemes for India.">
<meta name="theme-color" content="#1565D8">
<title>SwasthyaSaathi: Your Health. Our Support.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Colours. JS always sets data-theme to light or dark, so dark values live in ONE place. ===== */
:root{color-scheme:light;--bg:#F1F6FC;--card:#fff;--ink:#0F2740;--mut:#566B82;--line:#D9E5F2;--pri:#1565D8;--pri2:#0E9AA7;--on:#fff;--navy:#0B2A4A;--soft:#E6F0FD;--ok:#0F7A62;--okbg:#E3F5EF;--warn:#9A4A06;--warnbg:#FFF1DC;--bad:#B3261E;--badbg:#FDECEC;--r:16px;--sh:0 6px 22px #153c6510;--h1:#E3F0FF;--h2:#F7FBFF;--h3:#E4F7F1;
--c1b:#E7F1FF;--c1f:#1766C9;--c2b:#E3F7EF;--c2f:#168264;--c3b:#DFF6F8;--c3f:#0E7C86;--c4b:#FFF0D9;--c4f:#A65C0B;--c5b:#E9E6FF;--c5f:#6750C9;--c6b:#FFE9E1;--c6f:#C25B36;--c7b:#FDE7EF;--c7f:#C2306B;--c8b:#FDECEC;--c8f:#B3261E}
:root[data-theme=dark]{color-scheme:dark;--bg:#0A1626;--card:#10233B;--ink:#EAF2FB;--mut:#9DB2C9;--line:#26405F;--pri:#6FAEFF;--pri2:#4CD1D9;--on:#06213F;--navy:#06101D;--soft:#15304F;--ok:#4CD1AE;--okbg:#12362E;--warn:#F5B454;--warnbg:#3A2C0F;--bad:#FFB4AB;--badbg:#3A1620;--sh:0 6px 22px #0006;--h1:#132E4C;--h2:#10263A;--h3:#12352F;
--c1b:#17325A;--c1f:#8DBEFF;--c2b:#123A31;--c2f:#4CD1AE;--c3b:#0F3A40;--c3f:#5BD3E0;--c4b:#40300F;--c4f:#F5B454;--c5b:#2A2650;--c5f:#B7A8FF;--c6b:#44261C;--c6f:#FF9E7A;--c7b:#471F33;--c7f:#FF8DB5;--c8b:#3A1620;--c8f:#FFB4AB}
:root[data-hc]{--line:var(--ink);--mut:var(--ink)}
html{scroll-padding-top:70px}
html,body{height:100%;margin:0}
body{font:400 1rem/1.55 Inter,system-ui,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
svg{flex:none}.ic{width:20px;height:20px}.sm{width:18px;height:18px;vertical-align:-4px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;color:#000;padding:8px;z-index:50}
a{color:var(--pri)}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);height:100vh;height:100dvh}
@media(min-width:861px){.app.sb-off{grid-template-columns:minmax(0,1fr)}.app.sb-off .sb{display:none}}
.sb{background:linear-gradient(180deg,var(--navy),#0E3560);color:#DCE8F7;padding:18px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
:root[data-theme=dark] .sb{background:var(--navy)}
.sb :focus-visible{outline-color:#fff}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff;font-weight:800;letter-spacing:-.02em}
.logo small{display:block;font-weight:400;font-size:.72rem;color:#9DB6D3;letter-spacing:0}
.logo .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2F7BEA,#13B5B1);display:grid;place-items:center;color:#fff}
.logo .lg svg{width:22px;height:22px}
.nb{display:flex;gap:12px;align-items:center;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:11px;background:none;color:inherit;font:inherit;font-size:.92rem;text-align:left;cursor:pointer;transition:background .15s}
.nb:hover{background:#ffffff14}
.nb[aria-current=page]{background:linear-gradient(90deg,#1565D8,#1A83D8);color:#fff;box-shadow:0 4px 14px #1565d855}
.sos{margin-top:auto;background:#B3261E;border-radius:14px;padding:12px 14px;font-size:.84rem;color:#fff}
.sos a{color:#fff;font-weight:800;font-size:1.05rem;text-decoration:none;display:block;margin-top:2px}
main{overflow:auto;outline:0;max-width:1600px;width:100%;margin:0 auto;padding:0 clamp(14px,2.5vw,38px) 34px;scroll-behavior:smooth}
.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:6px;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.sp{margin-left:auto}
.pill,.ib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:42px;font:inherit;font-size:.85rem;cursor:pointer;text-decoration:none;transition:border-color .15s,transform .15s}
.pill:hover,.ib:hover{border-color:var(--pri)}
.ib{width:42px;padding:0;justify-content:center}
.pill.sosp{background:var(--badbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.scrim{display:none}
.tabbar{display:none}

/* ===== Text ===== */
h1{font-size:1.75rem;line-height:1.2;margin:.1em 0;letter-spacing:-.03em}
h2{font-size:1.1rem;margin:0 0 .4em;letter-spacing:-.01em}
.sub{color:var(--mut);margin:.2em 0 16px}
small{color:var(--mut)}
.bad{color:var(--bad)}

/* ===== Cards, buttons, forms ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:10px 0}
.urg{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad);border-radius:12px;padding:14px;font-weight:600;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 20px;border:1.5px solid var(--pri);border-radius:11px;background:var(--pri);color:var(--on);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px #1565d838}
.btn.o{background:none;color:var(--pri)}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.lnk{background:none;border:0;color:var(--pri);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;gap:6px;align-items:center;min-height:42px;padding:8px 16px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--pri)}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--on)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--pri);vertical-align:middle}
.tag.g{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--warnbg);color:var(--warn)}
label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 6px}
.f{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit}
.f:focus{border-color:var(--pri)}
.tg{display:flex;gap:10px;align-items:center;font-weight:500;min-height:40px;margin:4px 0}
.tg input{width:22px;height:22px}
.st{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.88rem}
.st.on{color:var(--pri);font-weight:600}
.st i{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem}
.st.on i{background:var(--pri);color:var(--on)}
details{border-top:1px solid var(--line);padding:8px 0;margin:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--pri);min-height:32px}
dt{font-weight:600;font-size:.85rem}dd{margin:0 0 8px;color:var(--mut)}
ul{padding-left:1.2em}
.list{list-style:none;padding:0;margin:0}
.rbw{display:flex;gap:6px;align-items:center}
.rb{flex:1;display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;color:var(--ink);font:inherit;cursor:pointer}
.rb:hover{border-color:var(--pri)}.rb b{font-size:.9rem;font-weight:600}

/* ===== Triage meter ===== */
.tri{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin:10px 0;border:1.5px solid}
.tri .dot{width:14px;height:14px;border-radius:50%;margin-top:5px;flex:none;background:currentColor}
.tri.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.tri.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.tri.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.tri div{color:var(--ink)}.tri b{color:inherit}

/* ===== Home ===== */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:clamp(14px,3vw,40px);min-height:250px;padding:clamp(22px,3.2vw,42px);border-radius:26px;border:1px solid var(--line);background:linear-gradient(112deg,var(--h1) 0%,var(--h2) 52%,var(--h3) 100%);box-shadow:0 12px 34px #164e7a14}
.hero h1{font-size:clamp(1.75rem,3vw,2.6rem);letter-spacing:-.045em;margin:10px 0 4px}
.hero h2{font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:650;margin:0 0 8px}
.hero .sub{max-width:620px;line-height:1.65;margin:0 0 6px}
.art{width:100%;height:auto;max-height:250px}
.art .a1{fill:var(--soft)}.art .a2{fill:var(--card)}.art .a3{fill:var(--bad);opacity:.92}.art .a5{fill:var(--pri)}.art .a6{fill:var(--ok)}
.art .a4{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.art .fl{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.ask{display:flex;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 6px 6px 18px;margin:16px 0 0;max-width:800px;min-height:60px;box-shadow:0 5px 18px #174b7610}
.ask:focus-within{border-color:var(--pri)}
.ask input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1rem;padding:10px 0;outline:0}
.ask .ib{border:0;background:none}
.ask .ib.rec{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.go{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);display:grid;place-items:center;cursor:pointer;transition:transform .18s,box-shadow .18s}
.go:hover{transform:translateY(-1px);box-shadow:0 5px 12px #1565d844}
.go:disabled{opacity:.5;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 0}
.stat{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:.86rem;font-weight:600}
.stat svg{color:var(--ok)}
.home-label{margin:26px 2px 12px}.home-label h2{font-size:1.12rem;margin:0}.home-label p{margin:3px 0 0;color:var(--mut);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 8px}
.act{display:flex;gap:14px;align-items:center;min-height:104px;padding:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:17px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--sh);transition:transform .18s,border-color .18s,box-shadow .18s}
.act:hover{transform:translateY(-3px);border-color:var(--pri)}
.act .i{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none}
.act .i svg{width:24px;height:24px}
.c1{background:var(--c1b);color:var(--c1f)}.c2{background:var(--c2b);color:var(--c2f)}.c3{background:var(--c3b);color:var(--c3f)}.c4{background:var(--c4b);color:var(--c4f)}.c5{background:var(--c5b);color:var(--c5f)}.c6{background:var(--c6b);color:var(--c6f)}.c7{background:var(--c7b);color:var(--c7f)}.c8{background:var(--c8b);color:var(--c8f)}
.act b{display:block;font-size:.95rem;line-height:1.3;margin-bottom:3px}.act span span{color:var(--mut);font-size:.84rem;line-height:1.4;display:block}
.home-bottom{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:16px;align-items:stretch}
.home-bottom .card{margin:0;border-radius:18px;padding:20px}
.tip-card{background:linear-gradient(135deg,var(--card),var(--okbg))}
.tip-art{float:right;width:84px;height:84px;margin:0 0 8px 12px}
.home-safety{display:flex;gap:10px;align-items:flex-start;margin:20px 0 0;padding:13px 15px;border:1px solid var(--line);border-radius:14px;color:var(--mut);font-size:.83rem;background:var(--card)}
.home-safety svg{color:var(--ok);margin-top:2px}
.helps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.hl{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:var(--ink)}
.hl:hover{border-color:var(--bad)}
.hl .n{font-size:1.5rem;font-weight:800;color:var(--bad);min-width:70px;letter-spacing:-.02em}
.hl small{display:block}

/* ===== Chat ===== */
#msgs{padding-bottom:8px}
.mr{display:flex;gap:10px;align-items:flex-start;margin:12px 0;animation:rise .3s ease both}
.mr.u{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);display:grid;place-items:center;flex:none}
.m{max-width:min(720px,92%);padding:12px 16px;border-radius:18px}
.m.u{background:linear-gradient(135deg,var(--pri),#1A83D8);color:var(--on);border-bottom-right-radius:4px}
:root[data-theme=dark] .m.u{background:var(--pri)}
.m.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.m p{margin:.4em 0}.m ul{margin:.4em 0}
.mact{display:flex;gap:14px;margin-top:6px}
.mact button{background:none;border:0;color:var(--mut);font:inherit;font-size:.8rem;cursor:pointer;padding:2px 0}
.mact button:hover{color:var(--pri)}
.dots i{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-5px)}}
.bar{position:sticky;bottom:0;padding:8px 0 10px;background:linear-gradient(180deg,transparent,var(--bg) 22%)}
.bar .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 0 4px;padding-bottom:2px}.bar .chip{flex:none;min-height:38px;font-size:.85rem}
.bar .ask{margin:6px 0 0;max-width:none}
.hint{display:block;text-align:center;margin-top:6px;font-size:.75rem}
.foot{color:var(--mut);font-size:.8rem;text-align:center;margin-top:24px}
#toast{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90%;box-shadow:0 8px 24px #0005}
:root[data-theme=dark] #toast{background:#2A4468}
.res{margin-top:10px;font-size:1.05rem}
/* Reduce motion setting + OS setting */
[data-calm] *,[data-calm] *::before,[data-calm] *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
[data-calm] .art .a4{stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){.art .a4{animation:none;stroke-dashoffset:0}*{scroll-behavior:auto!important}}

/* ===== Tablet and phone ===== */
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero .art{display:none}}
@media(max-width:860px){
.app{grid-template-columns:1fr}
.sb{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;padding-top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-100%);visibility:hidden;transition:transform .2s}
.sb.open{transform:none;visibility:visible}
.scrim.on{display:block;position:fixed;inset:0;background:#0008;z-index:19}
.two{grid-template-columns:1fr}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:0;background:none;color:var(--mut);font:inherit;font-size:.68rem;cursor:pointer;border-radius:10px}
.tabbar button[aria-current=page]{color:var(--pri);font-weight:700}
.tabbar button.e{color:var(--bad)}
main{padding-bottom:84px}
.bar{bottom:60px}
.pill.sosp{display:none}}
@media(max-width:640px){
.hero{padding:22px 18px;min-height:0;border-radius:20px}.hero h1{font-size:1.8rem}
.ask{padding-left:13px;gap:2px}.ask .ib{width:36px}
.stats{grid-template-columns:1fr}
.grid{grid-template-columns:1fr;gap:10px}.act{min-height:84px;padding:14px}
.top .pill span.l{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}

/* ===== Printing (symptom result, summaries) ===== */
@media print{.sb,.top,.tabbar,.scrim,.noprint,#toast,.bar{display:none!important}.app{display:block;height:auto}main{overflow:visible;padding:0}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>
<style id="skin">
/* ===== SKIN v2: new look, same content ===== */
:root{--pri:#2563EB;--pri2:#0EA5A4;--bg:#F3F7FF;--line:#E1EAF6;--r:20px;--sh:0 1px 2px #0f274008,0 10px 30px -10px #1d4ed82e;--shl:0 2px 4px #0f274010,0 22px 44px -14px #1d4ed84d;--fd:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
:root[data-theme=dark]{--pri:#6FAEFF;--pri2:#4CD1D9;--bg:#0A1626;--line:#26405F;--sh:0 1px 2px #0004,0 10px 30px -10px #0008;--shl:0 22px 44px -14px #000a}
body{background-color:var(--bg);background-image:radial-gradient(900px 520px at 88% -8%,#BFDBFE80,transparent 60%),radial-gradient(760px 520px at -6% 18%,#99F6E04d,transparent 60%);background-attachment:fixed}
:root[data-theme=dark] body{background-image:radial-gradient(900px 520px at 88% -8%,#1E3A8A55,transparent 60%),radial-gradient(760px 520px at -6% 18%,#0F766E40,transparent 60%)}
h1,h2,.logo{font-family:var(--fd)}h1{font-weight:800;letter-spacing:-.035em}h2{font-weight:700}
main{scrollbar-width:thin}
/* sidebar: floating glossy panel */
.app{grid-template-columns:278px minmax(0,1fr)}
.sb{margin:14px 0 14px 14px;border-radius:28px;padding:20px 12px;background:linear-gradient(170deg,#0B2F5C 0%,#0B4A86 58%,#0E7C86 135%);box-shadow:0 26px 50px -20px #0b2f5ccc}
:root[data-theme=dark] .sb{background:linear-gradient(170deg,#0A1B30,#0C2C4C 60%,#0B4650 140%)}
.logo{padding:6px 10px 22px;font-size:1.12rem}.logo .lg{width:44px;height:44px;border-radius:15px;box-shadow:0 10px 22px #0007}
.nb{border-radius:15px;min-height:46px;font-weight:500;transition:background .2s,transform .2s}
.nb:hover{background:#ffffff1c;transform:translateX(3px)}
.nb[aria-current=page]{background:linear-gradient(90deg,#ffffff30,#ffffff12);box-shadow:inset 0 0 0 1px #ffffff33;font-weight:700}
.nb[aria-current=page] svg{color:#7FF0E2}
.sos{background:linear-gradient(135deg,#E5484D,#B3261E);border-radius:20px;box-shadow:0 14px 28px -10px #b3261eaa}
/* top bar */

/* ===== Welcome screen ===== */

/* ===== v3 polish: refined details, chat typing UI ===== */
::selection{background:color-mix(in srgb,var(--pri) 28%,transparent)}

/* Page transitions and smooth chat typing */
@keyframes pageTextIn {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
#v .page-enter > h1, #v .page-enter > .sub,
#v .page-enter > .card, #v .page-enter > .two,
#v .page-enter > .hero, #v .page-enter > .grid,

}
#v .page-enter > :nth-child(2) { animation-delay: .04s; }
#v .page-enter > :nth-child(3) { animation-delay: .08s; }

.typing-caret {
  display: inline-block; width: 2px; height: 1em; margin-left: 2px;
  vertical-align: -2px; background: var(--pri);
  animation: caretBlink .8s steps(2, start) infinite;
}

/* Centered chatbot workspace: prompt bar first, conversation directly below */
.chat-workspace {
  width: min(100%, 900px);

}
.chat-workspace .bar {
  order: 0;
  position: relative;
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  padding: 14px;

// Smooth typing animation: update only the active answer bubble, never rebuild the whole chat.
async function typeOut(a, full) {

  const step = reduced ? Math.max(1, text.length) : 3;
  while (pos < text.length) {
    pos = Math.min(text.length, pos + step);
    a.t = text.slice(0, pos);
    const el = bubble();
    if (el) {
      const wasNearBottom = $("#v") && ($("#v").scrollHeight - $("#v").scrollTop - $("#v").clientHeight < 180);
      el.innerHTML = md(a.t) + '<span class="typing-caret" aria-hidden="true"></span>';

  }
  delete a.typing;
  const el = bubble();

<div class="card" style="margin-top:16px"><h2>Call for help straight away if there is</h2><ul><li><b>Chest pain or pressure</b>, sweating, or pain in the arm or jaw.</li><li><b>Stroke signs:</b> face drooping, arm weakness, slurred speech. Note the time they began.</li><li><b>Severe trouble breathing</b> or blue lips.</li><li><b>Heavy bleeding</b> that will not stop.</li><li><b>Fits, fainting</b> or a person who does not respond.</li><li><b>Poisoning or snakebite.</b> Keep the person still and go to a hospital at once. Do not cut the wound or give home remedies.</li><li><b>Thoughts of self-harm.</b> Call Tele-MANAS 14416 or 112.</li></ul></div>`,

tools:()=>`${hd(t("tools"),"Two quick checks. These are general guides, not a diagnosis.")}<div class="two" style="grid-template-columns:1fr 1fr"><form class="card" data-f="bmi"><h2>${ic("calc","sm")} BMI check (adults)</h2><label for="bh">Height (cm)</label><input class="f" id="bh" type="number" inputmode="decimal" min="50" max="250" required><label for="bw">Weight (kg)</label><input class="f" id="bw" type="number" inputmode="decimal" min="10" max="300" required><p><button class="btn">Check BMI</button></p><div id="bmir" class="res" aria-live="polite"></div><small>Uses cut-offs recommended for Asian adults. Not for children or pregnancy.</small></form>

// Health tools
const bmiCalc=(h,w)=>{const b=w/((h/100)**2),r=Math.round(b*10)/10;let c,k;
if(b<18.5){c="Underweight range";k="w"}else if(b<23){c="Healthy range";k="g"}else if(b<25){c="Overweight range (Asian cut-off)";k="w"}else{c="Obese range (Asian cut-off)";k="w"}return{b:r,c,k}};
const bpCalc=(s,d)=>{if(s>=180||d>=120)return{l:"Very high. Recheck after 5 minutes. If it stays this high, or you have chest pain, bad headache, weakness or trouble speaking, call 112 now.",k:"bad"};
if(s>=140||d>=90)return{l:"High (stage 2). Please see a doctor soon.",k:"warn"};if(s>=130||d>=80)return{l:"High (stage 1) by some guidelines. Recheck on another day and talk to a doctor.",k:"warn"};
if(s<90||d<60)return{l:"A low reading is possible. If you feel dizzy or faint, sit or lie down and seek medical advice. A clinician should interpret mixed readings.",k:"warn"};if(s>=120)return{l:"Slightly raised. Recheck at rest on another day and discuss repeated high readings with a clinician.",k:"ok"};return{l:"Within the usual adult range for this single reading. Keep in mind that one reading cannot diagnose or rule out a condition.",k:"ok"}}

document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.f;
if(f==="ask"){const i=e.target.querySelector("input"),v=i.value;if(!v.trim())return;if(busy)return toast(t("wait"));i.value="";send(v)}
if(f==="hosp"){st.state=$("#hst").value;st.dist=$("#hd").value.trim();hs.lat=0;hs.lng=0;save();render()}
if(f==="bmi"){const h=+$("#bh").value,w=+$("#bw").value,o=$("#bmir");if(!(h>=50&&h<=250&&w>=10&&w<=300)){o.innerHTML="<span class='bad'>Please enter a valid height and weight.</span>";return}const r=bmiCalc(h,w);o.innerHTML=`<b>BMI ${r.b}</b> <span class="tag ${r.k}">${r.c}</span>`}
if(f==="bp"){const s=+$("#bs").value,d=+$("#bd").value,o=$("#bpr");if(!(s>=60&&s<=260&&d>=30&&d<=160&&s>d)){o.innerHTML="<span class='bad'>Please enter valid numbers. The upper number must be higher than the lower.</span>";return}const r=bpCalc(s,d);o.innerHTML=`<b>${s}/${d} mmHg</b><div class="tri ${r.k}" style="margin-top:8px"><span class="dot"></span><div>${r.l}</div></div>`}
if(f==="temp"){const raw=Number($("#tv").value),unit=$("#tu").value,o=$("#tres");if(!Number.isFinite(raw)||raw<0||raw>110){o.innerHTML="<span class='bad'>Enter a temperature between 0 and 110, then choose the correct input unit.</span>";return}const c=unit==="c"?raw:(raw-32)*5/9,far=unit==="f"?raw:(raw*9/5)+32;if(c < 0 || c > 45){o.innerHTML="<span class='bad'>This reading is outside the supported human body-temperature range. Check the value and unit.</span>";return}o.innerHTML=`<b>${c.toFixed(1)} °C</b> <span class="tag">${far.toFixed(1)} °F</span><p class="sub">Conversion only — it does not diagnose an illness.</p>`}});
document.addEventListener("input",e=>{const x=e.target;
if(x.dataset.sf==="q"){sf.q=x.value;$("#sl").innerHTML=schList()}
if(x.dataset.s==="font"){st.font=+x.value;save();applySet();const o=$("#fsv");if(o)o.textContent=st.font}});
document.addEventListener("change",e=>{const x=e.target,k=x.dataset.s;
if(x.dataset.sf==="c"){sf.c=x.value;$("#sl").innerHTML=schList();return}
if(k&&k!=="font"){st[k]=x.type==="checkbox"?+x.checked:x.value;save();applySet();if(k!=="dist"){render();document.querySelector(`[data-s="${k}"]`)?.focus()}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSb()});

// ===== Quick self-test: run runTests() in the browser console =====
window.runTests=()=>{const r=[
["dengue match",match("fever headache rash")[0][0]==="Dengue"],
["no substring false match",!match("outbreak").length&&!match("fluids").length],
["red flag",RED.test("I have chest pain")],["hindi red flag",RED.test("सीने में दर्द है")],
["no false alarm",!RED.test("I have a mild cold")],
["education is not emergency",!isEmerg("What are the symptoms of a stroke?")],["personal stroke is emergency",isEmerg("My father may have a stroke")],
["safe text",!md("<script>").includes("<script>")],["bullets after text",md("Hi\n- a\n- b").includes("<ul>")],
["facts",facts("my son is 6 years old, fever for 3 days").age===6&&facts("fever for 3 days").days===3],
["triage emergency",triage({rf:["Chest pain"]})===3],["triage low",triage({du:DUR[0],sy:["Cough"],age:"Adult (18–59)"})===1],
["bmi",bmiCalc(170,65).c==="Healthy range"],["bp crisis",bpCalc(190,125).k==="bad"]];
r.forEach(([n,ok])=>console[ok?"log":"error"]((ok?"PASS ":"FAIL ")+n));return r.every(x=>x[1])};

applySet();render();

(function(){const s=$("#splash");if(!s)return;const nm=$("#spName"),lock=on=>[$("#app"),$("#tb")].forEach(e=>{if(e)on?e.setAttribute("inert",""):e.removeAttribute("inert")});let done=0,timer;
if(nm)nm.innerHTML=[..."SwasthyaSaathi"].map((c,i)=>`<span aria-hidden="true"${i>=8?' class="t"':""} style="animation-delay:${(0.5+i*0.07).toFixed(2)}s">${c}</span>`).join("");
const open=()=>{if(done)return;done=1;clearTimeout(timer);lock(false);s.classList.add("out");setTimeout(()=>{s.remove();$("#v h1")?.focus({preventScroll:true})},650)};
lock(true);s.addEventListener("click",e=>{if(e.target.closest("[data-open]"))open()});

timer=setTimeout(open,st.calm?1500:4200);try{s.querySelector(".sp-btn").focus({preventScroll:true})}catch{}})();
